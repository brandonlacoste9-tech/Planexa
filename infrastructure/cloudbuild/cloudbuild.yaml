# ============================================================================
# PLANEXA - Cloud Build CI/CD Pipeline
# Triggered on push to main branch
# ============================================================================

steps:
  # ========================================
  # STEP 1: Build Backend Docker Image
  # ========================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/planexa/backend:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/planexa/backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend'

  # ========================================
  # STEP 2: Push Backend Image
  # ========================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/planexa/backend'
    waitFor: ['build-backend']

  # ========================================
  # STEP 3: Deploy Backend to Cloud Run
  # ========================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'planexa-backend'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/planexa/backend:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--vpc-connector=planexa-vpc-connector'
      - '--vpc-egress=private-ranges-only'
      - '--set-secrets=MONGODB_URI=planexa-mongodb-uri:latest,JWT_SECRET=planexa-jwt-secret:latest,GOOGLE_API_KEY=planexa-google-api-key:latest,TWILIO_ACCOUNT_SID=planexa-twilio-account-sid:latest,TWILIO_AUTH_TOKEN=planexa-twilio-auth-token:latest'
      - '--set-env-vars=NODE_ENV=production,PORT=3000'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--cpu=1'
      - '--memory=512Mi'
    waitFor: ['push-backend']

  # ========================================
  # STEP 4: Install Frontend Dependencies
  # ========================================
  - name: 'node:20'
    id: 'install-frontend'
    entrypoint: 'npm'
    args: ['ci']
    dir: 'frontend'

  # ========================================
  # STEP 5: Build Frontend
  # ========================================
  - name: 'node:20'
    id: 'build-frontend'
    entrypoint: 'npm'
    args: ['run', 'build']
    dir: 'frontend'
    env:
      - 'VITE_API_URL=https://${_DOMAIN}/api'
    waitFor: ['install-frontend']

  # ========================================
  # STEP 6: Deploy Frontend to Cloud Storage
  # ========================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: 'gsutil'
    args:
      - '-m'
      - 'rsync'
      - '-r'
      - '-d'
      - 'frontend/dist'
      - 'gs://${PROJECT_ID}-planexa-frontend'
    waitFor: ['build-frontend']

  # ========================================
  # STEP 7: Set Cache Headers
  # ========================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'set-cache-headers'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # HTML files - no cache
        gsutil -m setmeta -h "Cache-Control:no-cache, no-store, must-revalidate" \
          gs://${PROJECT_ID}-planexa-frontend/**/*.html
        
        # JS/CSS with hashes - long cache
        gsutil -m setmeta -h "Cache-Control:public, max-age=31536000, immutable" \
          gs://${PROJECT_ID}-planexa-frontend/assets/**
    waitFor: ['deploy-frontend']

  # ========================================
  # STEP 8: Invalidate CDN Cache
  # ========================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'invalidate-cdn'
    entrypoint: 'gcloud'
    args:
      - 'compute'
      - 'url-maps'
      - 'invalidate-cdn-cache'
      - 'planexa-url-map'
      - '--path=/*'
      - '--async'
    waitFor: ['deploy-frontend']

# ========================================
# SUBSTITUTIONS
# ========================================
substitutions:
  _REGION: 'northamerica-northeast1'
  _DOMAIN: 'planexo.ca'

# ========================================
# OPTIONS
# ========================================
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# ========================================
# TIMEOUT
# ========================================
timeout: '1200s'

# ========================================
# IMAGES
# ========================================
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/planexa/backend:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/planexa/backend:latest'
